name: Deploy DEAD MILES to GitHub Pages

# Publishes the game to a `gh-pages` branch. This avoids the github-pages
# "environment" deployment-branch gate that blocks runs from feature branches
# (the cause of the 4-second deploy failure). After the first successful run,
# set: repo Settings -> Pages -> Source: "Deploy from a branch" -> gh-pages / (root).

on:
  push:
    branches: ["claude/text-visual-novel-game-vQ5k1", "main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "deadmiles-pages"
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Publish only the game so the site root serves index.html directly.
      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html _site/index.html

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true

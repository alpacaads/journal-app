<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0e0a">
<meta name="description" content="DEAD MILES — a text-based zombie survival visual novel. Upgrade your survivor and your ride, endlessly.">
<title>DEAD MILES // survival on the road</title>
<style>
  :root{
    --bg:#0a0e0a;
    --bg2:#0f150f;
    --ink:#9be88a;
    --ink-dim:#4f7a47;
    --amber:#e8b14a;
    --red:#e0563f;
    --blue:#5fb4d6;
    --pink:#d678a8;
    --line:#1e2a1c;
    --glow:0 0 6px rgba(155,232,138,.35);
    --mono:'Courier New',ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);}
  body{
    font-family:var(--mono);
    color:var(--ink);
    font-size:16px;
    line-height:1.5;
    overflow:hidden;
    -webkit-font-smoothing:none;
    user-select:none;
  }
  /* subtle scanline / crt vibe */
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
    background:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.18) 3px,rgba(0,0,0,0) 4px);
    mix-blend-mode:multiply;opacity:.5;
  }
  #app{
    display:flex;flex-direction:column;
    height:100dvh;max-width:760px;margin:0 auto;
    background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);
    position:relative;
  }

  /* ---------- HUD ---------- */
  #hud{
    display:flex;align-items:center;gap:8px;
    padding:8px 10px;border-bottom:1px solid var(--line);
    background:rgba(0,0,0,.25);font-size:12px;flex:0 0 auto;
  }
  #hud .title{color:var(--ink-dim);letter-spacing:2px;font-weight:bold;}
  #hud .spacer{flex:1;}
  .chip{color:var(--ink-dim);white-space:nowrap;}
  .chip b{color:var(--ink);}
  .chip.scrap b{color:var(--amber);}
  .chip.fuel b{color:var(--blue);}
  #statsBtn{
    background:none;border:1px solid var(--line);color:var(--ink-dim);
    font-family:var(--mono);font-size:12px;padding:4px 9px;border-radius:4px;cursor:pointer;
  }
  #statsBtn:active{background:var(--line);}

  /* ---------- main scene ---------- */
  #scene{
    flex:1 1 auto;overflow-y:auto;padding:14px 16px 6px;
    -webkit-overflow-scrolling:touch;scroll-behavior:smooth;
  }
  #scene::-webkit-scrollbar{width:0;}
  .art{
    white-space:pre;font-size:11px;line-height:1.15;color:var(--ink-dim);
    text-shadow:var(--glow);margin:0 0 10px;overflow-x:auto;
    display:block;
  }
  .art.amber{color:var(--amber);}
  .art.red{color:var(--red);}
  .art.blue{color:var(--blue);}
  .speaker{color:var(--amber);font-weight:bold;letter-spacing:1px;font-size:13px;margin:10px 0 2px;}
  .speaker.sys{color:var(--ink-dim);}
  .speaker.enemy{color:var(--red);}
  .narr{margin:0 0 4px;text-shadow:var(--glow);}
  .narr.dim{color:var(--ink-dim);}
  .narr.warn{color:var(--amber);}
  .narr.bad{color:var(--red);}
  .narr.good{color:var(--ink);}
  .narr.loot{color:var(--blue);}
  .rule{color:var(--line);margin:8px 0;user-select:none;}
  .cursor::after{content:"\2588";animation:blink 1s steps(1) infinite;color:var(--ink);}
  @keyframes blink{50%{opacity:0;}}

  /* ---------- choices ---------- */
  #choices{
    flex:0 0 auto;padding:8px 12px calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);background:rgba(0,0,0,.3);
    display:flex;flex-direction:column;gap:7px;max-height:46vh;overflow-y:auto;
  }
  .choice{
    display:block;width:100%;text-align:left;cursor:pointer;
    font-family:var(--mono);font-size:15px;color:var(--ink);
    background:rgba(155,232,138,.04);border:1px solid var(--line);
    border-radius:6px;padding:12px 13px;line-height:1.35;
    transition:background .08s,border-color .08s,transform .05s;
  }
  .choice:active{background:rgba(155,232,138,.14);transform:scale(.99);}
  .choice .key{color:var(--ink-dim);margin-right:8px;}
  .choice .cost{float:right;color:var(--amber);font-size:13px;}
  .choice.disabled{opacity:.4;border-style:dashed;}
  .choice.danger{border-color:#42201c;}
  .choice.danger .key{color:var(--red);}
  .choice.pickup{border-color:#1c2e3a;}
  .choice.tap{
    text-align:center;color:var(--ink-dim);border-style:dashed;
    animation:pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{50%{opacity:.55;}}

  /* ---------- stats drawer ---------- */
  #overlay{
    position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.55);
    display:none;align-items:flex-end;
  }
  #overlay.open{display:flex;}
  #drawer{
    width:100%;max-height:88%;overflow-y:auto;
    background:var(--bg2);border-top:2px solid var(--ink-dim);
    border-radius:14px 14px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom));
    animation:slideup .18s ease;
  }
  @keyframes slideup{from{transform:translateY(40px);opacity:.4;}to{transform:none;opacity:1;}}
  #drawer h2{font-size:13px;letter-spacing:2px;color:var(--amber);margin:0 0 10px;display:flex;}
  #drawer h2 .x{margin-left:auto;color:var(--ink-dim);cursor:pointer;padding:0 6px;}
  .panel{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:12px;}
  .panel .pt{color:var(--ink-dim);font-size:11px;letter-spacing:2px;margin-bottom:8px;}
  .panel .pt b{color:var(--ink);}
  .stat{display:flex;align-items:center;font-size:13px;margin:3px 0;gap:8px;}
  .stat .nm{flex:0 0 96px;color:var(--ink-dim);}
  .stat .vl{color:var(--ink);min-width:42px;}
  .bar{flex:1;height:9px;background:#000;border:1px solid var(--line);border-radius:3px;overflow:hidden;}
  .bar > i{display:block;height:100%;background:var(--ink);}
  .bar.hp > i{background:var(--red);}
  .bar.veh > i{background:var(--blue);}
  .bar.xp > i{background:var(--amber);}
  .modlist{font-size:12px;color:var(--ink-dim);line-height:1.6;}
  .modlist b{color:var(--ink);}
  .modlist .tag{color:var(--blue);}

  /* ---------- toasts ---------- */
  #toast{
    position:absolute;left:50%;bottom:calc(48vh + 10px);transform:translateX(-50%);
    z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:90%;
  }
  .toast{
    background:rgba(0,0,0,.85);border:1px solid var(--ink-dim);border-radius:6px;
    padding:6px 12px;font-size:13px;color:var(--ink);text-align:center;
    animation:tin .25s ease, tout .4s ease 1.6s forwards;max-width:100%;
  }
  .toast.amber{border-color:var(--amber);color:var(--amber);}
  .toast.red{border-color:var(--red);color:var(--red);}
  .toast.blue{border-color:var(--blue);color:var(--blue);}
  @keyframes tin{from{transform:translateY(8px);opacity:0;}}
  @keyframes tout{to{opacity:0;transform:translateY(-8px);}}

  .small{font-size:12px;color:var(--ink-dim);}
  .center{text-align:center;}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <span class="title">DEAD&nbsp;MILES</span>
    <span class="spacer"></span>
    <span class="chip mi">ACT <b id="hudMiles">1</b></span>
    <span class="chip scrap">⛭ <b id="hudScrap">0</b></span>
    <span class="chip fuel">HORDE <b id="hudFuel">0</b></span>
    <button id="statsBtn" onclick="UI.openDrawer()">STATUS</button>
  </div>

  <div id="scene" onclick="UI.sceneTap()"></div>

  <div id="choices"></div>

  <div id="toast"></div>

  <div id="overlay" onclick="if(event.target.id==='overlay')UI.closeDrawer()">
    <div id="drawer"></div>
  </div>
</div>

// Symmetric: you are hostile to a faction if it rivals your ally, or your ally rivals it.
function factionRelation(f){
  if(!S || !S.ally) return 'neutral';
  if(S.ally===f) return 'ally';
  const a=FACTION_INFO[S.ally], b=FACTION_INFO[f];
  if((a && a.rivals.includes(f)) || (b && b.rivals.includes(S.ally))) return 'hostile';
  return 'neutral';
}

function mulberry32(seed){ let a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const rnd = (n)=>Math.floor(RNG()*n);
const pick = (arr)=>arr[rnd(arr.length)];
const chance = (pct)=>RNG()*100 < pct;

const UI = {

  init(){
    this.scene = document.getElementById('scene');

  },

  // queue a line to be typed out
  add(html, cls){

    el.className = 'narr ' + (cls||'');
    el.innerHTML = html;
    this.scene.appendChild(el);
    this._scroll();
    return el;
  },
  art(name, col){
    const pre = document.createElement('pre');
    pre.className = 'art ' + (col||'');
    pre.textContent = ART[name] || '';
    this.scene.appendChild(pre);
    this._scroll();
  },
  artText(str, col){
    const pre = document.createElement('pre');
    pre.className = 'art ' + (col||'');
    pre.textContent = str;
    this.scene.appendChild(pre);
    this._scroll();
  },
  speaker(name, cls){
    const el = document.createElement('div');
    el.className='speaker '+(cls||'');
    el.textContent = name;
    this.scene.appendChild(el);
  },
  rule(){ const e=document.createElement('div'); e.className='rule'; e.textContent='— — — — — — — — — — — —'; this.scene.appendChild(e); },

  // Typewriter for a single narrative line element
  type(html, cls){
    return new Promise(res=>{
      const el = this.add('', cls);
      const tmp = document.createElement('div'); tmp.innerHTML=html;
      const text = tmp.textContent;
      let i=0; this.typing=true; this._full={el,html};
      el.classList.add('cursor');
      const step=()=>{
        if(!this.typing){ // skipped
          el.innerHTML=html; el.classList.remove('cursor'); this._scroll(); return res();
        }
        el.textContent = text.slice(0,i);
        this._scroll();
        if(i>=text.length){ el.innerHTML=html; el.classList.remove('cursor'); this.typing=false; return res(); }
        i++;
        const c = text[i-1];
        const d = (c==='.'||c==='!'||c==='?')?34:(c===','?20:12);
        setTimeout(step,d);
      };
      step();
    });
  },
  sceneTap(){ if(this.typing){ this.typing=false; } },

  _scroll(){ this.scene.scrollTop = this.scene.scrollHeight; },

  // choices: [{label, key, cls, cost, disabled, fn}]
  setChoices(list){
    this.choices.innerHTML='';
    list.forEach((c,idx)=>{
      const b=document.createElement('button');
      b.className='choice '+(c.cls||'')+(c.disabled?' disabled':'');
      const key = c.key!==undefined?c.key:(idx+1);
      let html = '<span class="key">'+key+'</span>'+c.label;
      if(c.cost) html += '<span class="cost">'+c.cost+'</span>';
      b.innerHTML=html;
      if(!c.disabled) b.onclick=()=>{ this.lockBriefly(); c.fn(); };
      this.choices.appendChild(b);
    });
  },
  tapToContinue(fn){
    this.setChoices([{label:'▾ tap to continue', cls:'tap', key:'', fn}]);
  },
  lockBriefly(){ /* prevent double-fire */ const c=this.choices; c.style.pointerEvents='none'; setTimeout(()=>c.style.pointerEvents='',180); },

  toast(msg, cls){
    const t=document.getElementById('toast');
    const e=document.createElement('div'); e.className='toast '+(cls||''); e.innerHTML=msg;
    t.appendChild(e); setTimeout(()=>e.remove(),2100);
  },

    UI.add('<span class="small">Salvage <b style="color:var(--amber)">'+META.salvage+'</b> &nbsp;·&nbsp; runs <b>'+META.runs+'</b> · escapes <b>'+META.escapes+'</b> · best <b>'+META.bestScore+'</b></span>');
    const opts=[];
    META_STORE.forEach(it=>{
      const owned = metaHas(it.id);
      opts.push({ key: owned?'✓':'⛭', cls: owned?'':'pickup', cost: owned?'owned':it.cost+' ⛭',
        disabled: owned || META.salvage<it.cost,
        label:'<b>'+it.name+'</b><br><span class="small">'+it.desc+'</span>',
        fn:()=>{ META.salvage-=it.cost;
          if(it.type==='vehicle') META.vehicles.push(it.id);
          else if(it.type==='survivor') META.survivors.push(it.id);
          else META.perks.push(it.id);
          saveMeta(); UI.toast('Unlocked: '+it.name,'amber'); Game.metaHub(); } });
    });
    opts.push({ key:'▸', label:'Back to title', fn:()=>Game.title() });
    UI.setChoices(opts);
  },

  /* ---- start a new run ---- */
  newRun(daily){
    loadMeta();
    Game._daily = daily;
    if(daily){ const d=new Date(); Game._seed=(d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate())>>>0; }
    Game.pickSurvivor();
  },
  pickSurvivor(){
    UI.clear(); UI.speaker('WHO ARE YOU?','sys');
    UI.add('The apocalypse files everyone to one sharp edge.'+(Game._daily?' <span class="small">[DAILY]</span>':''),'dim');
    const opts=ARCHETYPES.map((a,i)=>{
      const locked = a.unlock && !META.survivors.includes(a.id);
      return { key:i+1, disabled:locked,
        label:'<b>'+a.name+'</b> '+(locked?'<span class="small">🔒 unlock in the Garage</span>':'')+'<br><span class="small">'+a.blurb+' · '+a.perkText+'</span>',
        fn:()=>{ Game._arch=a.id; Game.pickVehicle(); } };
    });
    opts.push({ key:'↩', label:'Back', fn:()=>Game.title() });
    UI.setChoices(opts);
  },
  pickVehicle(){
    UI.clear(); UI.speaker('YOUR RIDE','sys');
    UI.add('Pick the heap you\'ll bleed for.','dim');
    const opts=STARTER_VEHICLES.map((v,i)=>{
      const locked = v.unlock && !META.vehicles.includes(v.id);
      return { key:i+1, disabled:locked,
        label:'<b>'+v.name+'</b> '+(locked?'<span class="small">🔒</span>':'')+'<br><span class="small">'+v.blurb+'</span>',
        fn:()=>Game.startRun(Game._arch, v.id) };
    });
    opts.push({ key:'↩', label:'Back', fn:()=>Game.pickSurvivor() });
    UI.setChoices(opts);
  },
  async startRun(arch, veh){
    RNG = Game._daily ? mulberry32(Game._seed) : Math.random;
    S = freshState(arch, veh);
    // meta start-perks
    if(META.perks.includes('p_medkit')){ S.inv.medkits++; S.surv.maxHp+=8; S.surv.hp+=8; }
    if(META.perks.includes('p_scrap')) S.scrap+=25;
    if(META.perks.includes('p_lead')) S.lead+=2;
    // archetype start-perks
    if(S.surv.perk==='berserk_start') S.surv.flags.berserk=true;
    if(arch==='scrapper') S.scrap+=15;
    if(META.perks.includes('p_relic')) Game.gainRelic(pick(RELICS).id);
    save(); UI.hud();
    UI.clear(); UI.art('car','blue');
    await UI.type('You drop into the <b>'+S.veh.name+'</b>, fire it up, and put the dead in your mirrors.');
    if(Game._daily) await UI.type('<span class="small">DAILY — seed '+Game._seed+'. The same road for everyone today.</span>','warn');
    Game.actIntro();
  },
  async actIntro(){
    const act = ACTS[(S.act-1)%ACTS.length];
    UI.clear(); UI.art('road');
    UI.speaker('ACT '+S.act+' · '+act.name,'sys');
    await UI.type('<span class="small">'+act.sub+'</span>');
    await UI.type('The horde is '+S.lead+' stages back and gaining. Don\'t stop moving for long.');
    Game.genChoices();
    UI.tapToContinue(()=>Game.routeMap());
  },

  /* ---- routing: after any node resolves ---- */
  resume(msg){ if(!S || S.over) return; save(); return Game.afterNode(msg); },

  afterNode(msg){
    if(!S || S.over) return; save();
    if(S._inBoss){ S._inBoss=false; return Game.actComplete(); }
    if(S._pendingRelic){ S._pendingRelic=false; return Game.relicReward(()=>Game.advanceRoute()); }
    return Game.advanceRoute(msg);
  },
  advanceRoute(msg){
    if(!S || S.over) return;
    if(S.lead<=0) return Game.hordeAssault();
    Game.genChoices(); Game.routeMap(msg);
  },

  /* ---- the route map (main hub) ---- */
  routeMap(msg){
    if(!S || S.over) return;
    save(); UI.clear(); UI.hud();
    const act = ACTS[(S.act-1)%ACTS.length];
    UI.artText(Game.renderRoute());
    UI.speaker('ACT '+S.act+' · '+act.name,'sys');
    const leadCol = S.lead<=1?'var(--red)':S.lead<=2?'var(--amber)':'var(--ink-dim)';
    UI.add('<span class="small">stage '+Math.min(S.stage+1,ACT_LEN+1)+'/'+(ACT_LEN+1)+' &nbsp;·&nbsp; mutation tier '+Game.mutTier()+' &nbsp;·&nbsp; horde <span style="color:'+leadCol+'">'+Math.max(0,S.lead)+' behind</span></span>');
    if(msg) UI.add(msg,'dim');
    if(S.lead<=1) UI.add('⚠ The horde is on your bumper. Pick a fast path.','bad');
    if(S.surv.hp < S.surv.maxHp*0.4) UI.add('✚ You\'re badly hurt — a Camp might be worth the time.','bad');
    if(S.relics.length) UI.add('<span class="small">◈ '+S.relics.map(id=>relicById(id).name).join(' · ')+'</span>','loot');
    UI.add('<span class="small">▸ where to next?</span>','warn');
    const opts = (S.choices||[]).map((nd)=>{
      const t=NODE_TYPES[nd.type]||{icon:'?',label:'?',desc:'',time:1};
      return { key:t.icon, cls:(nd.type==='cache'||nd.type==='elite')?'pickup':(nd.type==='boss'?'danger':''),
        label:'<b>'+(nd.title||t.label)+'</b> <span class="small">— '+(nd.desc||t.desc)+(t.time>1?' · slow (horde +1)':'')+'</span>',
        fn:()=>Game.enterNode(nd) };
    });
    opts.push({ key:'✕', cls:'danger', label:'Save &amp; quit to title', fn:()=>{ save(); Game.title(); } });
    UI.setChoices(opts);
  },
  renderRoute(){
    const total=ACT_LEN+1; let road='';
    for(let i=0;i<total;i++){ road += i<S.stage?'=': i===S.stage?'>': (i===total-1?'*':'.'); }
    const lead=Math.max(0,S.lead);
    return '  [you]'+road+'[COAST *]\n  horde '+'<'.repeat(Math.min(8,lead+1))+'  ('+lead+' stages back)';
  },

  /* ---- generate the next branching choices ---- */
  genChoices(){
    if(S.stage>=ACT_LEN){ const act=ACTS[(S.act-1)%ACTS.length]; S.choices=[{type:'boss',title:'BOSS · '+act.bossName,desc:'the only way through'}]; return; }
    const pool=[]; const add=(t,w)=>{ for(let i=0;i<Math.max(0,w);i++) pool.push(t); };
    add('fight',5); add('event',3); add('scav',3); add('garage',2); add('market',2);
    add('camp', S.surv.hp<S.surv.maxHp*0.6?4:1);
    add('elite', 1+Math.floor(S.stage/2));
    add('cache', 1+Math.floor(((S.act-1)%ACTS.length)/2));
    const types=[]; let guard=0;
    while(types.length<3 && guard++<80){ const t=pick(pool); if(!types.includes(t)) types.push(t); }
    while(types.length<2) types.push('fight');
    S.choices=types.map(t=>{
      const nd={type:t};
      if(t==='market'){ nd.faction=ACTS[(S.act-1)%ACTS.length].faction; nd.title='Outpost · '+FACTION_INFO[nd.faction].name; }
      return nd;
    });
  },

  enterNode(nd){
    if(!S || S.over) return;
    S.node=nd;
    const t=NODE_TYPES[nd.type]||{time:1};
    let cost=t.time||1; if(S.relics.includes('lead_foot')) cost=Math.max(0,cost-1);
    S.lead -= cost;
    S.stage++;
    S.miles += 3 + rnd(3);
    S.nodeFaction = nd.faction || ACTS[(S.act-1)%ACTS.length].faction;
    S.danger = (S.act-1)*4 + S.stage + Math.max(0, 4 - S.lead) + (S.endless?4:0);
    save();
    switch(nd.type){
      case 'fight':  return Game.combat(false);
      case 'elite':  S._pendingRelic=true; return Game.combat(false,{elite:true});
      case 'boss':   S._inBoss=true; return Game.bossFight();
      case 'scav':   return Game.scavenge();
      case 'garage': return Game.garage();
      case 'market': return Game.market();
      case 'camp':   return Game.rest();
      case 'event':  return Game.roadEvent();
      case 'cache':  return Game.relicCache();
      default:       return Game.combat(false);
    }
  },
  async bossFight(){
    const act=ACTS[(S.act-1)%ACTS.length];
    UI.clear(); UI.art('horde','red'); UI.speaker('BOSS · '+act.bossName,'enemy');
    await UI.type(act.bossLine);
    UI.tapToContinue(()=>Game.combat(true,{boss:true}));
  },

  /* ---- the horde catches you ---- */
  async hordeAssault(){
    UI.clear(); UI.art('horde','red'); UI.speaker('THE HORDE CATCHES YOU','enemy');
    await UI.type('The wave crashes over the road. No more running — carve a hole and punch through, or be buried here.');
    UI.tapToContinue(()=>Game.combat(true,{assault:true}));
  },

  /* ---- act cleared (boss down) ---- */
  async actComplete(){
    UI.clear(); UI.art('sun','amber'); UI.speaker('ACT '+S.act+' CLEARED','sys');
    await UI.type('The boss falls. The road ahead opens, and for a moment the dead are far behind.','good');
    Game.relicReward(()=>{
      if(S.act>=ACTS.length) return Game.runWin();
      S.act++; S.stage=0; S.lead=5 + (META.perks.includes('p_lead')?2:0);
      Game.actIntro();
    });
  },

  /* ---- relics ---- */
  relicReward(then){
    const bag=RELICS.filter(r=>!S.relics.includes(r.id));
    if(!bag.length){ UI.toast('All relics owned!'); const sc=15+rnd(15); S.scrap+=sc; UI.toast('+'+sc+' scrap','amber'); return then(); }
    const offers=[]; while(offers.length<3 && bag.length) offers.push(bag.splice(rnd(bag.length),1)[0]);
    UI.clear(); UI.art('sun','amber'); UI.speaker('◈ A RELIC','sys');
    UI.add('Something rare glints in the wreckage. Bolt one to your legend:','good');
    UI.setChoices(offers.map((r,i)=>({ key:i+1, cls:'pickup',
      label:'<b>'+r.name+'</b><br><span class="small">'+r.desc+'</span>',
      fn:()=>{ Game.gainRelic(r.id); then(); } })));
  },
  gainRelic(id){
    if(!S.relics.includes(id)){ S.relics.push(id); S.run.relics++; const r=relicById(id); if(r&&r.onGain)r.onGain(S); UI.toast('◈ '+r.name,'amber'); UI.hud(); save(); }
  },
  async relicCache(){
    UI.clear(); UI.art('garage','amber'); UI.speaker('SEALED CACHE','sys');
    await UI.type('A reinforced case in a wreck, somehow untouched. Inside — something rare.');
    Game.relicReward(()=>{ const sc=8+rnd(10)+(S.relics.includes('hoarder')?8:0); S.scrap+=sc; UI.toast('+'+sc+' scrap','amber'); Game.afterNode(); });
  },

  /* ---- run end ---- */
  async runWin(){
    S.endless=true; clearSave();
    UI.clear(); UI.art('sun','amber'); UI.speaker('THE RED DAWN','sys');
    await UI.type('You smash through the last of them onto the pier. Hands haul you aboard, the boat pulls away, and the engine carries you out toward a red, impossible dawn.','good');
    await UI.type('You reached the coast. But the dead keep learning — and every shore has its own.','dim');
    Game.runEnd(true);
  },
  runEnd(escaped){
    loadMeta();
    const sc = S.run.kills*2 + S.run.elites*15 + S.run.bosses*40 + (S.act-1)*60 + S.run.relics*12 + Math.floor(S.miles) + (escaped?500:0) + Game.mutTier()*8;
    S.run.score=sc;
    const payout = Math.floor(sc/6) + S.run.bosses*5 + (escaped?40:0);
    META.salvage += payout; META.runs++; if(escaped) META.escapes++;
    const best = sc>META.bestScore; META.bestScore=Math.max(META.bestScore,sc); META.deepestAct=Math.max(META.deepestAct,S.act);
    saveMeta(); clearSave();
    UI.clear(); UI.art(escaped?'sun':'skull', escaped?'amber':'red');
    UI.speaker(escaped?'ESCAPED — RUN COMPLETE':'YOU DIED','sys');
    UI.add('<b>'+S.surv.name+'</b> · reached Act '+S.act+' · Level '+S.surv.level,'dim');
    UI.rule();
    UI.add('Kills <b>'+S.run.kills+'</b> · Elites <b>'+S.run.elites+'</b> · Bosses <b>'+S.run.bosses+'</b> · Relics <b>'+S.run.relics+'</b> · Miles <b>'+S.miles+'</b>');
    UI.add('SCORE <b style="color:var(--amber)">'+sc+'</b>'+(best?' &nbsp;<b style="color:var(--ink)">★ NEW BEST!</b>':' <span class="small">(best '+META.bestScore+')</span>'),'good');
    UI.add('Salvage earned <b style="color:var(--amber)">+'+payout+' ⛭</b> <span class="small">(banked '+META.salvage+')</span>','loot');
    const opts=[];
    if(escaped) opts.push({ key:'∞', cls:'pickup', label:'<b>KEEP DRIVING</b> <span class="small">— endless, ever harder</span>',
      fn:()=>{ S.over=false; S.endless=true; S.act++; S.stage=0; S.lead=5; S.run.score=0; save(); Game.actIntro(); } });
    opts.push({ key:'▸', label:'<b>NEW RUN</b>', fn:()=>{ S=null; Game.newRun(false); } });
    opts.push({ key:'⚒', label:'THE GARAGE <span class="small">— spend '+META.salvage+' salvage</span>', cls:'pickup', fn:()=>{ S=null; Game.metaHub(); } });
    opts.push({ key:'✕', label:'Title', fn:()=>{ S=null; Game.title(); } });
    UI.setChoices(opts);
  },

  /* ---- faction market (settlement shop) ---- */
  market(){
    const fac = S.nodeFaction || 'convoy';
    const rel = factionRelation(fac);
    UI.clear(); UI.art('camp','amber');
    UI.speaker((FACTION_INFO[fac]?FACTION_INFO[fac].name:'TRADERS').toUpperCase()+' OUTPOST','sys');
    if(rel==='hostile'){ UI.add('They know your colours. The gate stays shut — nothing for you here.','bad'); UI.setChoices([{key:'▸',label:'Move on',fn:()=>Game.resume()}]); return; }
    UI.add('Scrap on hand: <b>'+S.scrap+' ⛭</b>'+(rel==='ally'?' <span class="small">· ALLIED</span>':''),'dim');
    const havenAlly = S.ally==='haven';
    function item(name, desc, cost, fn, disabled){
      return { key:'⛭', cls:'pickup', cost:cost+' ⛭', disabled:disabled || S.scrap<cost,
        label:'<b>'+name+'</b><br><span class="small">'+desc+'</span>',
        fn:()=>{ S.scrap-=cost; fn(); if(fac in FACTION_INFO) addRep(fac,1); UI.toast('Bought '+name,'amber'); save(); Game.market(); } };
    }
    const opts=[];
    opts.push(item('Medkit ✚', havenAlly?'heal ~40% mid-fight · Haven price':'heal ~40% mid-fight', havenAlly?10:18, ()=>{ S.inv.medkits++; }));
    const rc = Math.ceil((S.veh.maxInteg-S.veh.integ)/4);
    opts.push(item('Field repair','restore vehicle integrity to max',rc||1,()=>{ S.veh.integ=S.veh.maxInteg; }, S.veh.integ>=S.veh.maxInteg));
    opts.push(item('Patch yourself up','restore HP to full',Math.ceil((S.surv.maxHp-S.surv.hp)/3)||1,()=>{ S.surv.hp=S.surv.maxHp; }, S.surv.hp>=S.surv.maxHp));
    if(fac==='reaper') opts.push(item('Reaper blade','+4 survivor attack (permanent)',40,()=>{ S.surv.atk+=4; }));
    if(fac==='haven')  opts.push(item('Hot meal &amp; a cot','heal fully now, +4 max HP',20,()=>{ S.surv.maxHp+=4; S.surv.hp=S.surv.maxHp; }));
    if(fac==='convoy') opts.push(item('Engine tune','+2 vehicle ram (permanent)',24,()=>{ S.veh.ram+=2; }));
    if(fac==='remnant')opts.push(item('Combat stim','+8 max HP, heal it',22,()=>{ S.surv.maxHp+=8; S.surv.hp=Math.min(S.surv.maxHp,S.surv.hp+8); }));
    if(fac in FACTION_INFO){
      opts.push({ key:'✦', cls:'pickup', label:'Take a job for '+FACTION_INFO[fac].name+' <span class="small">— +standing</span>', fn:()=>Game.factionJob(fac) });
      if(S.ally!==fac && S.rep[fac] >= FACTION_INFO[fac].pledgeAt){
        const defect=!!S.ally;
        opts.push({ key:'⚑', cls:'danger', label:(defect?'Defect to ':'Pledge to ')+FACTION_INFO[fac].name+' <span class="small">'+(defect?'— betrays '+FACTION_INFO[S.ally].name:'— unlocks perks, angers rivals')+'</span>', fn:()=>Game.pledge(fac) });
      }
    }
    opts.push({ key:'▸', label:'Hit the road', fn:()=>Game.resume() });
    UI.setChoices(opts);
  },

  /* ---- Remnant intel (story spine beat) ---- */
  async intel(){
    UI.clear(); UI.art('skull','blue');
    UI.speaker('THE REMNANT','sys');
    await UI.type('The scientist spreads cracked tablets across a steel table. "The infection isn\'t dying. It\'s learning. New strains every week — faster, smarter, worse."');
    await UI.type('"But there IS a boat. The Pier, past the coastal ruins. The dead know it\'s the last way out, though — they\'re massing there." She slides you a data-slate. "Take this. And take care, driver."');
    S.objective = 'Reach The Pier and escape by sea — but the dead are massing there.';
    if(!S.seenBeats.includes('lab_intel')){
      S.seenBeats.push('lab_intel');
      S.surv.xp += 20; S.scrap += 15; UI.toast('+20 XP · +15 scrap','amber');
      UI.add('<span class="small">Objective updated.</span>','warn');
    }
    save();
    UI.tapToContinue(()=>{ if(S.surv.xp>=S.surv.xpNext) Game.levelUp(); else Game.worldMap(); });

  /* ---- pledge allegiance to a faction (active alliance + consequences) ---- */
  async pledge(f){
    const info = FACTION_INFO[f];
    const prev = S.ally;
    UI.clear(); UI.art('camp','amber');
    UI.speaker('ALLEGIANCE','sys');
    if(prev && prev!==f){ addRep(prev,-60); }
    S.ally = f; addRep(f,15);
    await UI.type('You throw in with <b>'+info.name+'</b>. From here out, '+info.perk+'.','good');
    const rivals = info.rivals.filter(x=>x in FACTION_INFO).map(x=>FACTION_INFO[x].name);
    if(rivals.length) await UI.type(rivals.join(' and ')+' will treat you as an enemy now — gates closed, patrols hunting the roads.','warn');
    if(prev && prev!==f) await UI.type(FACTION_INFO[prev].name+' will not forget that you turned your coat.','bad');

    UI.tapToContinue(()=>Game.market());

    UI.clear(); UI.art('horde','red');
    UI.speaker('THE PIER','enemy');

  win(){

    UI.speaker('THE RED DAWN','sys');
    UI.add('You smash through the last of them and the '+S.veh.name+' skids onto the pier in a spray of bone and salt.','good');
    UI.add('Hands haul you aboard. The boat pulls away. The dead pour off the pier\'s edge into the black water behind you, and the engine carries you out toward a red, impossible dawn.','');

    UI.add('You made it. <b>'+S.surv.name+'</b> · '+S.miles+' miles survived · Level '+S.surv.level+'.','warn');

    UI.setChoices([
      { key:'∞', cls:'pickup', label:'<b>SURVIVAL MODE</b> <span class="small">— keep going, endlessly. The threat never stops rising.</span>',

      { key:'✕', label:'Rest here a while (back to title)', fn:()=>Game.title() },
    ]);
  },

  async roadEvent(){
    const ev = pick(['hitchhiker','wreck','blockade','dog']);
    UI.clear();
    if(ev==='hitchhiker'){
      UI.speaker('STRANGER','');
      await UI.type('A figure on the shoulder waves you down. Could be a survivor. Could be bait.');
      UI.setChoices([
        {label:'Slow down and help', key:1, fn:async()=>{
          UI.clear();
          if(chance(60)){ const sc=8+rnd(10); S.scrap+=sc; if(chance(40))S.inv.medkits++;
            await UI.type('They\'re real. Grateful. They press supplies into your hands before melting back into the ruins.');
            UI.toast('+'+sc+' scrap','amber'); UI.tapToContinue(()=>Game.resume()); }
          else { await UI.type('It lunges the second you brake — never alive at all.'); UI.tapToContinue(()=>Game.combat(false)); }
        }},
        {label:'Floor it past them', key:2, cls:'danger', fn:()=>{ UI.toast('You drive on.'); Game.resume('You don\'t look in the mirror.'); }},
      ]);
    } else if(ev==='wreck'){
      UI.speaker('ROADSIDE','sys');
      await UI.type('A jackknifed fuel truck blocks half the road. The tank might still have something in it.');

  garage(found){

    const repairCost = Math.ceil((S.veh.maxInteg-S.veh.integ)/4);
    if(S.veh.integ<S.veh.maxInteg) opts.push({ key:'R', cost:repairCost+' ⛭', disabled:S.scrap<repairCost||repairCost===0,
      label:'<b>Full repair</b><br><span class="small">restore integrity to max</span>',
      fn:()=>{ S.scrap-=repairCost; S.veh.integ=S.veh.maxInteg; UI.toast('Repaired','blue'); save(); Game.garage(found); } });
    opts.push({ key:'▸', label:'Back to the road', fn:()=>Game.resume() });
    UI.setChoices(opts);
  },

  /* ---- roll N distinct upgrade offers, respecting taken/repeatable ---- */
  rollOffers(pool, taken, n){
    let avail = pool.filter(u=>u.repeatable || !taken.includes(u.id));
    // weight by rarity (rarer = less common)
    const out=[];
    const bag=[];
    avail.forEach(u=>{ const w = u.rare===1?5:u.rare===2?3:1; for(let i=0;i<w;i++)bag.push(u); });
    while(out.length<n && bag.length){
      const u=bag.splice(rnd(bag.length),1)[0];
      if(!out.includes(u)) out.push(u);
    }
    // fall back to procedural endless boosts if pool exhausted
    while(out.length<n){ out.push(Game.procUpgrade(pool===VEH_UPGRADES)); }
    return out;
  },

  // endless procedurally-scaling boost so upgrades never run out
  procUpgrade(isVeh){
    const tier = 1 + Math.floor(S.miles/15);
    if(isVeh){
      const k = pick(['armor','ram','speed','integ']);
      const amt = tier + rnd(tier+1);
      const map={armor:['Field Plating','+'+amt+' armor',s=>s.veh.armor+=amt],
                 ram:['Scrap Spikes','+'+(amt*2)+' ram',s=>s.veh.ram+=amt*2],
                 speed:['Stripped Frame','+'+amt+' speed',s=>s.veh.speed+=amt],
                 integ:['Patch Welds','+'+(amt*6)+' max integ',s=>{s.veh.maxInteg+=amt*6;s.veh.integ+=amt*6;}]};
      return { id:'proc', name:map[k][0]+' '+tier, desc:map[k][1], rare:1, repeatable:true, apply:map[k][2] };
    } else {
      const k = pick(['atk','def','hp','agi']);
      const amt = tier + rnd(tier+1);
      const map={atk:['Sharpened Edge','+'+amt+' attack',s=>s.surv.atk+=amt],
                 def:['Scrap Armor','+'+amt+' defense',s=>s.surv.def+=amt],
                 hp:['Hard Living','+'+(amt*5)+' max HP',s=>{s.surv.maxHp+=amt*5;s.surv.hp+=amt*5;}],
                 agi:['Wiry','+'+amt+' agility',s=>s.surv.agi+=amt]};
      return { id:'proc', name:map[k][0]+' '+tier, desc:map[k][1], rare:1, repeatable:true, apply:map[k][2] };
    }
  },

  /* ===================== COMBAT ===================== */
  // The Mutation Clock: rises with act depth (and hard in endless mode).
  mutTier(){ if(!S) return 0; return Math.min(9, (S.act-1)*2 + Math.floor(S.stage/2) + (S.endless?2:0)); },

  mkFoe(tpl, scale, bonusHp){
    const hp = Math.round(tpl.base.hp*scale) + (bonusHp||0) + (tpl.elite?40:0);
    return { tpl, name:tpl.name, hp, maxHp:hp,
      atk:Math.round(tpl.base.atk*scale), agi:tpl.base.agi,
      pierce:!!tpl.pierce, ambush:!!tpl.ambush, summon:!!tpl.summon,
      evasion:tpl.evasion||0, explode:tpl.explode||0, elite:!!tpl.elite, exploded:false };
  },

  combat(boss, opts){
    if(!S || S.over) return;
    opts = opts || {};
    const mt = Game.mutTier();
    const scale = 1 + S.danger*0.16 + mt*0.05;
    // Faction patrol — human enemies, not the dead.
    if(opts.patrol){
      const sol = FACTION_INFO[opts.patrol].soldier;
      const pn = 1 + rnd(2) + Math.floor(S.danger/4);
      const pfoes=[]; const pb={xp:0,scrap:0};
      for(let i=0;i<pn;i++){ pfoes.push(Game.mkFoe(sol, scale, 0)); pb.xp+=sol.xp; pb.scrap+=sol.scrap; }
      Game._cb = { foes:pfoes, boss:false, turn:1, summonsLeft:0, bounty:pb, mt, scale, patrol:opts.patrol, human:true, quest:null };
      return Game.combatIntro();
    }
    const isBoss = boss || opts.boss || opts.assault;
    const eScale = scale * (opts.elite?1.5:1);
    const pool = ZOMBIES.filter(z=>!z.elite && z.tier<=mt);
    const n = isBoss ? 3+rnd(3)+Math.floor(mt/3) : opts.elite ? 1+rnd(2) : 1+rnd(Math.min(4,1+Math.floor(S.danger/2)));
    // adaptation: the dead lean toward whatever counters your habits
    const ramHeavy   = S.tactics.ram   > S.tactics.melee + 3;
    const meleeHeavy = S.tactics.melee > S.tactics.ram   + 3;
    const foes=[]; const bounty={xp:0,scrap:0};
    for(let i=0;i<n;i++){
      let tpl;
      if(isBoss && i===0){
        tpl = (mt>=4 && chance(70)) ? ZOMBIES.find(z=>z.id==='tyrant') : ZOMBIES.find(z=>z.id==='brute');
      } else if(opts.elite && i===0){
        // an elite: a strong strain, beefed up
        tpl = pick(ZOMBIES.filter(z=>!z.elite && z.tier<=Math.max(2,mt)));
      } else {
        const bag=[];
        pool.forEach(z=>{
          let w = Math.max(1, 4 - z.tier);
          if(ramHeavy   && (z.id==='brute'||z.id==='bloater')) w+=3;  // punish ram-spam
          if(meleeHeavy && (z.id==='runner'||z.id==='stalker')) w+=3; // punish melee-spam
          for(let k=0;k<w;k++) bag.push(z);
        });
        tpl = bag.length ? pick(bag) : ZOMBIES[0];
      }
      const f = Game.mkFoe(tpl, (opts.elite&&i===0)?eScale:scale, isBoss?20:0);
      if(opts.elite && i===0){ f.elite=true; f.name='Elite '+f.name; f.hp=Math.round(f.hp*1.6); f.maxHp=f.hp; }
      foes.push(f);
      bounty.xp += tpl.xp * ((opts.elite&&i===0)?2:1); bounty.scrap += tpl.scrap * ((opts.elite&&i===0)?2:1);
    }
    Game._cb = { foes, boss:isBoss, elite:!!opts.elite, assault:!!opts.assault, turn:1, summonsLeft:3+mt, bounty, mt, scale, quest:opts.quest||null };
    Game.combatIntro();
  },

  async combatIntro(){
    const cb=Game._cb;
    UI.clear();
    UI.art(cb.boss?'horde':cb.foes[0].tpl.art, cb.foes[0].tpl.col || (cb.boss?'red':''));
    if(cb.patrol){
      UI.speaker(FACTION_INFO[cb.patrol].name.toUpperCase()+' PATROL','enemy');
      await UI.type('Headlights flare across the road — '+cb.foes.length+' of '+FACTION_INFO[cb.patrol].name+'\'s killers, and they\'ve marked your colours. No talking your way out of this one.');
    } else {
      UI.speaker(cb.boss?'THE HORDE':'CONTACT','enemy');
      await UI.type(cb.boss
        ? 'They come from everywhere at once — '+cb.foes.length+' of them, and one big enough to block out the sky.'
        : (cb.foes.length>1?cb.foes.length+' of them peel off a wreck and come for you.':'A '+cb.foes[0].name+' fixes on you and charges.'));
    }

    // Telegraph any strain you've never seen before — escalating dread.
    const fresh=[];
    for(const f of cb.foes){ if(f.tpl.telegraph && !S.seenStrains.includes(f.tpl.id)){ S.seenStrains.push(f.tpl.id); fresh.push(f.tpl); } }
    if(fresh.length){
      save();
      for(const t of fresh){ UI.speaker('⚠ NEW STRAIN','enemy'); await UI.type(t.telegraph,'warn'); }
    }

    // Lurkers ambush before the first turn.
    const lurkers=cb.foes.filter(f=>f.ambush);
    if(lurkers.length){
      UI.speaker('AMBUSH!','enemy');
      for(const f of lurkers){
        if(S.surv.dodge && chance(S.surv.dodge)){ await UI.type('A '+f.name+' bursts from cover — but you slip aside.','dim'); continue; }
        const def = S.surv.def + (S.surv.perk==='tough'?1:0);
        const taken = Math.max(1, f.atk+rnd(3)-def);
        S.surv.hp = Math.max(0, S.surv.hp-taken);
        await UI.type('A '+f.name+' lunges from hiding — <b>'+taken+'</b> damage before you can raise your guard!','bad');
      }
      UI.hud();
      if(S.surv.hp<=0) return UI.tapToContinue(()=>Game.death());
    }
    Game.combatTurn();
  },

  combatTurn(){
    const cb=Game._cb;
    if(S.surv.hp<=0 || S.veh.integ<=0) return Game.death();
    if(cb.foes.length===0) return Game.victory();
    UI.clear();
    // enemy roster
    UI.speaker('THREATS · mutation tier '+cb.mt,'enemy');
    cb.foes.forEach((f,i)=>{
      const tags=[];
      if(f.pierce)tags.push('pierces armour');
      if(f.summon)tags.push('summons');
      if(f.evasion)tags.push('evasive');
      if(f.explode)tags.push('explodes');
      if(f.elite)tags.push('ELITE');
      UI.add(`<span class="small">[${i+1}]</span> <b>${f.name}</b> &nbsp;HP ${f.hp}/${f.maxHp} &nbsp;<span class="small">atk ${f.atk}${tags.length?' · '+tags.join(', '):''}</span>`, 'bad');
    });
    UI.rule();
    UI.add(`<span class="small">YOU ${S.surv.hp}/${S.surv.maxHp} HP ✚ &nbsp;|&nbsp; ${S.veh.name} ${S.veh.integ}/${S.veh.maxInteg} ⚙</span>`);

    const opts=[
      { key:'⚔', label:'MELEE the nearest <span class="small">— your attack '+Game.survDmgText()+'</span>', fn:()=>Game.playerMelee(0) },
      { key:'⊕', label:'RAM with the '+S.veh.name+' <span class="small">— hits hard, takes damage</span>', fn:()=>Game.playerRam() },
    ];
    if(cb.foes.length>1){
      opts[0].label='MELEE a target <span class="small">— pick who</span>';
      opts[0].fn=()=>Game.chooseTarget(t=>Game.playerMelee(t));
    }
    if(S.inv.medkits>0) opts.push({ key:'✚', cls:'pickup', label:'Use medkit <span class="small">— heal ~40%</span>',
      fn:()=>{ S.inv.medkits--; const h=Math.round(S.surv.maxHp*0.4); S.surv.hp=Math.min(S.surv.maxHp,S.surv.hp+h); UI.toast('+'+h+' HP','red'); Game.enemyPhase('You patch yourself mid-fight (+'+h+' HP).'); } });
    opts.push({ key:'⤺', cls:'danger', label:'FLOOR IT — try to escape <span class="small">— speed vs the swarm</span>', fn:()=>Game.flee() });
    UI.setChoices(opts);
  },

  survDmgText(){ const lo=S.surv.atk, hi=S.surv.atk+5; return lo+'–'+hi; },

  chooseTarget(then){
    const cb=Game._cb;
    UI.setChoices(cb.foes.map((f,i)=>({ key:i+1, cls:'danger',
      label:`Strike <b>${f.name}</b> <span class="small">(${f.hp} HP)</span>`,
      fn:()=>then(i) })).concat([{key:'↩',label:'back',fn:()=>Game.combatTurn()}]));
  },

  rollSurvDamage(){
    let dmg = S.surv.atk + rnd(6) + (S.ally==='reaper'?3:0); // Reaper gear
    let crit=false;
    if(chance(S.surv.crit)){ dmg=Math.round(dmg*2); crit=true; }
    if(S.surv.flags.berserk && S.surv.hp < S.surv.maxHp/3) dmg=Math.round(dmg*1.6);
    if(S.relics.includes('glass_cannon')) dmg=Math.round(dmg*1.6); // Glass Cannon
    return {dmg,crit};
  },

  async playerMelee(ti){
    const cb=Game._cb; const f=cb.foes[ti]; if(!f) return Game.combatTurn();
    S.tactics.melee++;
    UI.clear();
    UI.speaker('YOU','');
    // Stalkers and other evasive strains can slip your blade.
    if(f.evasion && chance(f.evasion)){
      await UI.type('You swing hard — but the '+f.name+' simply isn\'t where it was. Nothing but air.','dim');
      return Game.afterPlayerAction();
    }
    const {dmg,crit}=Game.rollSurvDamage();
    const canExec = (S.surv.flags.execute && f.hp<=f.maxHp*0.18) || (S.relics.includes('reapers_favor') && !f.elite && f.hp<=f.maxHp*0.25);
    if(canExec){
      f.hp=0;
      await UI.type('You drive your blade through its skull — <b>execution</b>. It drops instantly.','good');
    } else {
      f.hp-=dmg;
      await UI.type((crit?'<b>CRITICAL!</b> ':'')+'You smash the '+f.name+' for <b>'+dmg+'</b>.'+(crit?' Bone gives.':''),'good');
      if(S.surv.flags.lifesteal){ const h=Math.round(dmg*0.2); S.surv.hp=Math.min(S.surv.maxHp,S.surv.hp+h); if(h>0)UI.toast('+'+h+' HP','red'); }
    }
    Game.afterPlayerAction();
  },

  async playerRam(){
    const cb=Game._cb;
    S.tactics.ram++;
    let dmg = S.veh.ram + rnd(6) + (S.veh.flags.plow?S.veh.speed:0) + (S.ally==='reaper'?4:0);
    if(S.relics.includes('glass_cannon')) dmg=Math.round(dmg*1.6);
    UI.clear();
    UI.speaker(S.veh.name,'');
    const f=cb.foes[0];
    f.hp-=dmg;
    await UI.type('You gun it and slam the '+f.name+' for <b>'+dmg+'</b>. Wet crunch of impact.','good');
    if(S.veh.flags.flamer){ cb.foes.forEach(z=>{ if(z!==f){ z.hp-=4+rnd(5); } }); await UI.type('Flame jets wash over the rest of the pack.','warn'); }
    const nitroChance = (S.veh.flags.nitro?25:0) + (S.relics.includes('nitro_saint')?40:0);
    if(nitroChance && chance(nitroChance)){ const d2=Math.round(dmg*0.6); f.hp-=d2; await UI.type('The ram strikes <b>twice</b> — another '+d2+'!','warn'); }
    const recoil=Math.max(0, 2+rnd(4) - Math.floor(S.veh.armor/2));
    if(recoil>0){ S.veh.integ=Math.max(0,S.veh.integ-recoil); await UI.type('The hit rattles your ride. <span class="small">−'+recoil+' integrity</span>','dim'); }
    Game.afterPlayerAction();
  },

  async afterPlayerAction(){
    const cb=Game._cb;
    // passive roof turret picks a living target
    if(S.veh.turret>0){ const t=cb.foes.find(z=>z.hp>0); if(t){ t.hp-=S.veh.turret; UI.add('Roof turret stitches the '+t.name+' for '+S.veh.turret+'.','dim'); } }
    await Game.resolveDeaths();
    UI.hud();
    if(S.surv.hp<=0 || S.veh.integ<=0) return UI.tapToContinue(()=>Game.death());
    if(cb.foes.length===0) return UI.tapToContinue(()=>Game.victory());
    UI.tapToContinue(()=>Game.enemyPhase());
  },

  // Remove the dead — but Bloaters erupt on the way out.
  async resolveDeaths(){
    const cb=Game._cb;
    for(const f of cb.foes){
      if(f.hp<=0 && f.explode && !f.exploded){
        f.exploded=true;
        const blast=f.explode+rnd(6);
        const sd=Math.max(1, blast-Math.floor(S.surv.def/2));
        const vd=Math.max(0, blast-S.veh.armor);
        S.surv.hp=Math.max(0,S.surv.hp-sd);
        S.veh.integ=Math.max(0,S.veh.integ-vd);
        cb.foes.forEach(z=>{ if(z!==f && z.hp>0) z.hp-=Math.round(blast/2); });
        UI.speaker('⚠ ERUPTION','enemy');
        await UI.type('The '+f.name+' bursts in a gout of acid and bone — <b>'+sd+'</b> to you, <b>'+vd+'</b> to the '+S.veh.name+', and it splashes the pack around it.','bad');
      }
    }
    const dead=cb.foes.filter(z=>z.hp<=0);
    if(dead.length){
      UI.add(dead.map(z=>z.name).join(', ')+(dead.length>1?' go down.':' goes down.'),'dim');
      S.run.kills += dead.length;
      if(S.relics.includes('blood_engine')){ const h=dead.length*2; S.surv.hp=Math.min(S.surv.maxHp,S.surv.hp+h); }
      if(S.relics.includes('vulture')){ S.scrap += dead.length*3; }
    }
    cb.foes = cb.foes.filter(z=>z.hp>0);
  },

  async enemyPhase(pre){
    const cb=Game._cb;
    UI.clear();
    UI.speaker('THE DEAD','enemy');
    if(pre) UI.add(pre,'dim');
    // survivor regen
    if(S.surv.regen>0 && S.surv.hp<S.surv.maxHp){ S.surv.hp=Math.min(S.surv.maxHp,S.surv.hp+S.surv.regen); }
    // screamers drag more dead into the fight
    const screamers=cb.foes.filter(f=>f.summon);
    if(screamers.length && cb.summonsLeft>0 && cb.foes.length<8){
      const w=ZOMBIES.find(z=>z.id==='walker');
      let summoned=0;
      for(const s of screamers){
        if(cb.summonsLeft<=0 || cb.foes.length>=8) break;
        cb.summonsLeft--; summoned++;
        const nf=Game.mkFoe(w, cb.scale, 0);
        cb.foes.push(nf); cb.bounty.xp+=w.xp; cb.bounty.scrap+=w.scrap;
      }
      if(summoned) await UI.type('A Screamer\'s shriek splits the air — '+summoned+' more dead claw out of the dark to answer it!','bad');
    }
    // allied-faction backup
    if(S.ally && cb.foes.length){
      const t=cb.foes[0];
      if(S.ally==='convoy'){ const d=8+S.danger; t.hp-=d; UI.add('A Convoy gun-truck roars past and rakes the '+t.name+' for '+d+'.','dim'); }
      else if(S.ally==='reaper'){ const d=6+rnd(6); t.hp-=d; UI.add('Your Reaper escort buries a cleaver in the '+t.name+' for '+d+'.','dim'); }
      else if(S.ally==='remnant'){ if(S.surv.hp<S.surv.maxHp){ const h=5; S.surv.hp=Math.min(S.surv.maxHp,S.surv.hp+h); UI.add('A Remnant serum steadies you. <span class="small">+'+h+' HP</span>','dim'); } }
      await Game.resolveDeaths();
      UI.hud();
      if(S.surv.hp<=0 || S.veh.integ<=0) return UI.tapToContinue(()=>Game.death());
      if(cb.foes.length===0) return UI.tapToContinue(()=>Game.victory());
    }
    let guardReady = (S.ally==='haven'); // Haven marksmen blunt the first blow
    for(const f of cb.foes){
      if(S.surv.hp<=0||S.veh.integ<=0) break;
      // dodge?
      if(S.surv.dodge && chance(S.surv.dodge)){ await UI.type('You twist aside — the '+f.name+'\'s lunge finds nothing.','dim'); continue; }
      // target: mostly survivor, sometimes vehicle
      const atVeh = chance(35);
      let dmg = f.atk + rnd(3);
      if(atVeh){
        const armor = f.pierce?0:S.veh.armor;
        const taken=Math.max(1,dmg-armor);
        S.veh.integ=Math.max(0,S.veh.integ-taken);
        let extra='';
        if(S.relics.includes('razor_hull')){ f.hp-=4; extra=' The razor hull bites back — 4 to it.'; }
        await UI.type('The '+f.name+' claws into the '+S.veh.name+'. <span class="small">−'+taken+' integrity</span>'+extra,'bad');
      } else {
        let def = S.surv.def + (S.surv.perk==='tough'?1:0);
        if(f.pierce) def=Math.floor(def/2);
        let taken=Math.max(1,dmg-def);
        if(guardReady){ const blunted=Math.max(0,Math.floor(taken/2)); guardReady=false; UI.add('Haven marksmen stitch the '+f.name+' mid-lunge — the blow lands half-spent.','dim'); taken=blunted; }
        S.surv.hp=Math.max(0,S.surv.hp-taken);
        await UI.type('The '+f.name+' tears into you. <span class="small">−'+taken+' HP</span>','bad');
      }
    }
    UI.hud();
    if(S.surv.hp<=0||S.veh.integ<=0) return UI.tapToContinue(()=>Game.death());
    Game._cb.turn++;
    UI.tapToContinue(()=>Game.combatTurn());
  },

  async flee(){
    const cb=Game._cb;
    UI.clear();
    UI.speaker('ESCAPE','sys');
    const fastest=Math.max(...cb.foes.map(f=>f.agi));
    const mine=S.surv.agi + Math.floor(S.veh.speed/2) + rnd(6);
    if(mine > fastest+2 || S.fuel<2 && chance(40)){
      await UI.type('You break contact, fishtail onto open road, and leave them clawing at your dust.','good');
      // small fuel cost
      S.fuel=Math.max(0,S.fuel-3); UI.hud();
      UI.tapToContinue(()=>Game.resume('Heart pounding, you put miles between you and them.'));
    } else {
      await UI.type('Too slow — they swarm the car before you can build speed. One free swipe each.','bad');
      // enemies get a free hit, then back to combat
      for(const f of cb.foes){ const taken=Math.max(1,f.atk-S.surv.def); S.surv.hp=Math.max(0,S.surv.hp-taken); }
      UI.hud();
      if(S.surv.hp<=0) return UI.tapToContinue(()=>Game.death());
      UI.tapToContinue(()=>Game.combatTurn());
    }
  },

  async victory(){
    const cb=Game._cb;
    if(S.surv.hp<=0 || S.veh.integ<=0) return Game.death(); // never "win" already dead
    // run counters
    if(cb.elite) S.run.elites++;
    if(cb.boss && !cb.assault) S.run.bosses++;
    if(cb.assault){ S.lead=Math.max(S.lead,3); }
    UI.clear();
    UI.art(cb.boss?'sun':'skull', cb.boss?'amber':'dim');
    UI.speaker(cb.assault?'BROKE THROUGH':cb.boss?'BOSS DOWN':cb.elite?'ELITE SLAIN':'CLEARED','sys');
    // rewards scale with the bounty of everything that turned up (summons included)
    const bounty = cb.bounty || {xp:8,scrap:5};
    const xpMult = (1 + S.danger*0.05) * (S.ally==='remnant'?1.25:1); // Remnant study bonus
    const xp = Math.round(bounty.xp * xpMult) + rnd(6);
    const scrap = Math.round(bounty.scrap * (1 + S.danger*0.04)) + S.surv.scav*2 + rnd(4);
    S.surv.xp += xp; S.scrap += scrap;
    await UI.type(cb.patrol
      ? 'The last of '+FACTION_INFO[cb.patrol].name+'\'s patrol drops. Costly enemies to make. <span class="small">+'+xp+' XP · +'+scrap+' scrap</span>'
      : 'The last of them stops twitching. You\'re still breathing. <span class="small">+'+xp+' XP · +'+scrap+' scrap</span>','good');
    // faction job complete — standing reward
    if(cb.quest && (cb.quest in FACTION_INFO)){
      addRep(cb.quest, 20);
      const bonus = 10 + S.danger;
      S.scrap += bonus;
      await UI.type('Job done for '+FACTION_INFO[cb.quest].name+'. They won\'t forget it. <span class="small">+20 standing · +'+bonus+' scrap</span>','loot');
    }
    // second wind
    if(S.surv.flags.secondWind){ const h=Math.round(S.surv.maxHp*0.18); S.surv.hp=Math.min(S.surv.maxHp,S.surv.hp+h); UI.toast('Second Wind +'+h+' HP','red'); }
    // vehicle autorepair
    if(S.veh.autorepair>0){ S.veh.integ=Math.min(S.veh.maxInteg,S.veh.integ+S.veh.autorepair); UI.toast('Repair Rig +'+S.veh.autorepair,'blue'); }
    // drop chance
    if(chance(30)){ S.inv.medkits++; UI.add('You loot a medkit from the bodies. <span class="small">+1 ✚</span>','loot'); }
    if(chance(20)){ S.inv.fuelcans++; UI.add('One of them died clutching a fuel can. <span class="small">+1 ⛽-can</span>','loot'); }
    UI.hud(); save();
    // level up?
    if(S.surv.xp >= S.surv.xpNext){ return UI.tapToContinue(()=>Game.levelUp()); }
    UI.tapToContinue(()=>Game.resume());
  },

  levelUp(){
    while(S.surv.xp>=S.surv.xpNext){ S.surv.xp-=S.surv.xpNext; S.surv.level++; S.surv.xpNext=Math.round(S.surv.xpNext*1.35+10); }
    S.surv.maxHp+=4; S.surv.hp=S.surv.maxHp; // small base bump + full heal on level
    UI.clear();
    UI.art('sun','amber');
    UI.speaker('LEVEL UP — LV '+S.surv.level,'sys');
    UI.add('You\'re sharper, harder, harder to kill. (+4 max HP, fully healed) Choose what hardens next:','good');
    let offers = Game.rollOffers(SURV_UPGRADES, S.surv.mods, 3);
    const render=()=>{
      UI.setChoices(offers.map((u,i)=>({
        key:i+1, cls:'pickup',
        label:`<b>${u.name}</b><br><span class="small">${u.desc}</span>`,
        fn:()=>{ u.apply(S); if(!u.repeatable)S.surv.mods.push(u.id); UI.toast('Learned: '+u.name,'red'); save(); Game.resume('Stronger now. The road waits.'); }
      })).concat(
        S.surv.perk==='lucky' && !Game._rerolled ? [{key:'↻',cls:'danger',label:'Reroll choices <span class="small">(Lucky)</span>',fn:()=>{ Game._rerolled=true; offers=Game.rollOffers(SURV_UPGRADES,S.surv.mods,3); render(); }}] : []
      ));
    };
    Game._rerolled=false;
    render();
  },

  death(){
    if(!S) return;
    // Phoenix Cell relic — cheat death once per run.
    if(S.relics.includes('phoenix') && !S._phoenixUsed){
      S._phoenixUsed=true; S._inBoss=false; S._pendingRelic=false;
      S.surv.hp=Math.max(1,Math.round(S.surv.maxHp*0.3));
      S.veh.integ=Math.max(1,Math.round(S.veh.maxInteg*0.3));
      UI.clear(); UI.art('sun','amber'); UI.speaker('PHOENIX CELL','sys');
      UI.add('Your heart stops — then the cell jolts it back. You tear free of the swarm and live.','good');
      UI.hud(); save();
      UI.tapToContinue(()=>Game.advanceRoute('You broke away, barely.'));
      return;
    }
    S.over=true;
    UI.clear(); UI.art('carWreck','red'); UI.speaker('THE ROAD ENDS','enemy');
    UI.add(S.surv.hp<=0
      ? 'They drag you out through the broken window. You don\'t feel the last of it.'
      : 'The engine dies with a final cough, and the dead close over the '+S.veh.name+' like water.','bad');
    UI.tapToContinue(()=>Game.runEnd(false));
  },
};

/* ----------------------------- BOOT ------------------------------------ */
window.addEventListener('load', ()=>{ UI.init(); Game.title(); });
// keyboard support for desktop testing (1-9, space/enter to continue)
window.addEventListener('keydown', (e)=>{
  if(UI.typing && (e.key===' '||e.key==='Enter')){ UI.sceneTap(); e.preventDefault(); return; }
  const btns=document.querySelectorAll('#choices .choice');
  if(/^[1-9]$/.test(e.key)){ const b=btns[parseInt(e.key)-1]; if(b)b.click(); }
  if((e.key===' '||e.key==='Enter') && btns.length===1){ btns[0].click(); e.preventDefault(); }
});
</script>
</body>
